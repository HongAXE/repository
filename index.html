<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa;
            color: #2d3436;
            padding-bottom: 70px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-nav {
            background: #2d3436;
            display: flex;
            overflow-x: auto;
            padding: 10px 12px;
            gap: 8px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .top-nav button {
            background: transparent;
            border: none;
            color: #b2bec3;
            padding: 6px 16px;
            font-size: 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }
        .top-nav button.active {
            background: #0984e3;
            color: #fff;
        }
        .content {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: #f5f6fa;
        }
        .file-item {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .file-item:active {
            background: #dfe6e9;
        }
        .file-item .name {
            font-weight: 500;
            flex: 1;
            word-break: break-all;
        }
        .file-item .size {
            color: #636e72;
            font-size: 13px;
            margin-left: 12px;
            white-space: nowrap;
        }
        .file-item .arrow {
            color: #b2bec3;
            margin-left: 8px;
        }
        .empty {
            text-align: center;
            color: #b2bec3;
            padding: 40px 0;
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #636e72;
        }
        .error-msg {
            text-align: center;
            padding: 20px 0;
            color: #e17055;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            border-top: 1px solid #dfe6e9;
            height: 60px;
            align-items: center;
            justify-content: space-around;
            z-index: 20;
        }
        .bottom-nav .tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            color: #636e72;
            font-size: 14px;
            cursor: pointer;
            border: none;
            background: transparent;
        }
        .bottom-nav .tab.active {
            color: #0984e3;
            font-weight: 600;
        }
        .about-page {
            display: none;
            padding: 20px 0;
            text-align: center;
        }
        .about-page .version {
            font-size: 20px;
            font-weight: 600;
            margin: 16px 0 8px;
        }
        .about-page .desc {
            color: #636e72;
            margin-bottom: 20px;
        }
        .about-page .links a {
            display: inline-block;
            margin: 8px 12px;
            color: #0984e3;
            text-decoration: none;
            font-weight: 500;
        }
        #fileList { display: block; }
        #aboutPage { display: none; }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-nav" id="topNav">
        <button class="active" data-folder="APP">APP</button>
        <button data-folder="Malody">Malody</button>
        <button data-folder="Phira">Phira</button>
        <button data-folder="osu!">osu!</button>
    </div>

    <!-- 内容区 -->
    <div class="content" id="contentArea">
        <div id="fileList"></div>
        <div id="aboutPage" class="about-page">
            <div class="version">资源库 v1.0</div>
            <div class="desc">基于蓝奏云 · 收集各类软件与游戏</div>
            <div class="links">
                <a href="https://github.com/你的用户名/你的仓库" target="_blank">GitHub仓库</a>
                <a href="https://你的个人主页" target="_blank">作者主页</a>
            </div>
            <p style="color:#b2bec3;font-size:14px;">© 2026 你的名字</p>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <button class="tab active" data-page="file">📁 文件</button>
        <button class="tab" data-page="about">ℹ️ 关于</button>
    </div>

    <script>
        // ========== 重要：替换为你的 files.json 的 raw 链接 ==========
        // 获取方式：在 GitHub 上打开 files.json，点击 Raw，复制地址栏链接
        const DATA_URL = 'https://raw.githubusercontent.com/你的用户名/你的仓库/main/files.json';

        // ========== 状态 ==========
        let currentFolder = 'APP';
        let currentPage = 'file';
        let cachedData = null;

        // ========== DOM ==========
        const topNavBtns = document.querySelectorAll('#topNav button');
        const bottomTabs = document.querySelectorAll('.bottom-nav .tab');
        const fileListEl = document.getElementById('fileList');
        const aboutPageEl = document.getElementById('aboutPage');

        function showLoading() {
            fileListEl.innerHTML = '<div class="loading">加载中...</div>';
        }

        function renderFiles(files) {
            if (!files || files.length === 0) {
                fileListEl.innerHTML = '<div class="empty">该分类暂无文件</div>';
                return;
            }
            let html = '';
            files.forEach(item => {
                const name = item.name || '未命名';
                const size = item.size || '';
                const url = item.url || '';
                html += `
                    <div class="file-item" data-url="${url}">
                        <span class="name">${name}</span>
                        <span class="size">${size}</span>
                        <span class="arrow">▶</span>
                    </div>
                `;
            });
            fileListEl.innerHTML = html;
            document.querySelectorAll('.file-item').forEach(el => {
                el.addEventListener('click', function() {
                    const url = this.dataset.url;
                    if (url) window.open(url, '_blank');
                    else alert('无法获取下载链接');
                });
            });
        }

        function loadData() {
            showLoading();
            if (cachedData) {
                showCategory(currentFolder);
                return;
            }
            fetch(DATA_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    cachedData = data;
                    showCategory(currentFolder);
                })
                .catch(err => {
                    fileListEl.innerHTML = `<div class="error-msg">加载失败，请检查网络</div>`;
                });
        }

        function showCategory(folderKey) {
            if (!cachedData) return;
            const files = cachedData[folderKey] || [];
            renderFiles(files);
        }

        function switchFolder(folderKey) {
            currentFolder = folderKey;
            topNavBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.folder === folderKey));
            if (cachedData) showCategory(folderKey);
            else showLoading();
        }

        function switchPage(page) {
            currentPage = page;
            bottomTabs.forEach(tab => tab.classList.toggle('active', tab.dataset.page === page));
            if (page === 'file') {
                fileListEl.style.display = 'block';
                aboutPageEl.style.display = 'none';
                loadData();
            } else {
                fileListEl.style.display = 'none';
                aboutPageEl.style.display = 'block';
            }
        }

        // ========== 事件绑定 ==========
        topNavBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (currentPage === 'file') switchFolder(this.dataset.folder);
                else { switchPage('file'); setTimeout(() => switchFolder(this.dataset.folder), 100); }
            });
        });
        bottomTabs.forEach(tab => {
            tab.addEventListener('click', function() { switchPage(this.dataset.page); });
        });

        // ========== 启动 ==========
        switchPage('file');
    </script>
</body>
</html>
