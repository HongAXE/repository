name: 同步蓝奏云文件列表

on:
  workflow_dispatch:          # 允许手动触发
  schedule:
    - cron: '0 0 * * *'       # 每天 UTC 0:00（北京时间 8:00）自动运行

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行爬虫
        run: |
          python scraper.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --staged --quiet || git commit -m "auto: 同步蓝奏云文件列表 $(date +'%Y-%m-%d %H:%M')"
          git push